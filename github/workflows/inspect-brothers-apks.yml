name: Inspect Brother APK Projects

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify ZIPs
        shell: bash
        run: |
          set -e

          for f in \
            "Apk 1.zip" \
            "Apk 2.zip" \
            "The base apk to use.zip"
          do
            test -f "$f" || {
              echo "::error::Missing $f"
              exit 1
            }

            echo "FOUND: $f"
            ls -lh "$f"
            unzip -t "$f" >/dev/null
            echo "ZIP OK: $f"
            echo
          done

      - name: Extract all projects
        shell: bash
        run: |
          set -e

          rm -rf inspection
          mkdir -p inspection/apk1
          mkdir -p inspection/apk2
          mkdir -p inspection/base

          unzip -q "Apk 1.zip" -d inspection/apk1
          unzip -q "Apk 2.zip" -d inspection/apk2
          unzip -q "The base apk to use.zip" -d inspection/base

          echo "Extraction complete."

      - name: Inventory projects
        shell: bash
        run: |
          set -e

          REPORT="inspection/PROJECT_INVENTORY.txt"

          {
            echo "AETHERWAVE BROTHER APP INSPECTION"
            echo "================================="
            echo
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "ZIP SIZES"
            echo "---------"
            ls -lh "Apk 1.zip" "Apk 2.zip" "The base apk to use.zip"
            echo

            for dir in apk1 apk2 base
            do
              echo
              echo "========================================"
              echo "PROJECT: $dir"
              echo "========================================"
              echo

              echo "--- Top-level files/directories ---"
              find "inspection/$dir" -maxdepth 2 -type f -o -type d \
                | sort | head -300

              echo
              echo "--- Android manifests ---"
              find "inspection/$dir" \
                -type f \
                \( -name "AndroidManifest.xml" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
                -print

              echo
              echo "--- Gradle/settings files ---"
              find "inspection/$dir" \
                -type f \
                \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "gradle.properties" \) \
                -print

              echo
              echo "--- Source files ---"
              find "inspection/$dir" \
                -type f \
                \( \
                  -name "*.kt" \
                  -o -name "*.java" \
                  -o -name "*.dart" \
                  -o -name "*.xml" \
                  -o -name "*.gradle" \
                  -o -name "*.kts" \
                  -o -name "*.json" \
                  -o -name "*.properties" \
                  -o -name "*.yaml" \
                  -o -name "*.yml" \
                \) \
                -print | sort

              echo
              echo "--- Package / namespace references ---"
              grep -RInE \
                --include='*.kt' \
                --include='*.java' \
                --include='*.xml' \
                --include='*.gradle' \
                --include='*.kts' \
                'package |namespace[[:space:]]*=|applicationId[[:space:]]*=|android:name=' \
                "inspection/$dir" 2>/dev/null \
                | head -500 || true

              echo
              echo "--- Download / storage / MediaStore references ---"
              grep -RInE \
                --include='*.kt' \
                --include='*.java' \
                --include='*.xml' \
                'MediaStore|DownloadManager|Environment\.DIRECTORY_MUSIC|DIRECTORY_MUSIC|externalFilesDir|MediaScanner|RELATIVE_PATH|Music/' \
                "inspection/$dir" 2>/dev/null \
                | head -500 || true

              echo
              echo "--- Network/API references ---"
              grep -RInE \
                --include='*.kt' \
                --include='*.java' \
                --include='*.dart' \
                --include='*.xml' \
                'https?://|Retrofit|OkHttp|HttpURLConnection|Volley|Dio|RapidAPI|API_KEY|BASE_URL' \
                "inspection/$dir" 2>/dev/null \
                | head -500 || true
            done
          } > "$REPORT"

          echo "=============================================="
          echo "INSPECTION INVENTORY CREATED"
          echo "=============================================="

          wc -l "$REPORT"
          sed -n '1,220p' "$REPORT"

      - name: Create source manifest
        shell: bash
        run: |
          set -e

          {
            echo "AETHERWAVE SOURCE FILE MANIFEST"
            echo "==============================="
            echo

            for dir in apk1 apk2 base
            do
              echo
              echo "### $dir"
              find "inspection/$dir" -type f \
                ! -path '*/.git/*' \
                ! -name '*.apk' \
                ! -name '*.aab' \
                ! -name '*.so' \
                | sort
            done
          } > inspection/SOURCE_MANIFEST.txt

      - name: Remove unnecessary binary build outputs
        shell: bash
        run: |
          set -e

          # Keep source/project files for inspection.
          # Remove huge generated/build artifacts if any were inside the ZIPs.
          find inspection \
            -type d \
            \( \
              -name build \
              -o -name .gradle \
              -o -name .dart_tool \
              -o -name node_modules \
            \) \
            -prune -exec rm -rf {} + 2>/dev/null || true

          find inspection \
            -type f \
            \( -name '*.apk' -o -name '*.aab' -o -name '*.so' \) \
            -delete 2>/dev/null || true

      - name: Package inspection
        shell: bash
        run: |
          set -e

          cd inspection

          zip -qr ../aetherwave-brother-apps-inspection.zip .

          cd ..

          ls -lh aetherwave-brother-apps-inspection.zip

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-brother-apps-inspection
          path: |
            aetherwave-brother-apps-inspection.zip
            inspection/PROJECT_INVENTORY.txt
            inspection/SOURCE_MANIFEST.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7