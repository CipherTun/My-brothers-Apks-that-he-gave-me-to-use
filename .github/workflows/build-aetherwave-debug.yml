name: Build Aetherwave Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate base APK ZIP
        run: |
          set -e

          mkdir -p work/input

          FILE="$(find . -type f -iname '*.zip' -print \
            | grep -Ei 'The base Apk to use|base.*zip' \
            | head -1)"

          if [ -z "$FILE" ]; then
            echo "ERROR: Base APK ZIP not found."
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Using: $FILE"

          unzip -q "$FILE" -d work/input

          APK="$(find work/input -type f -name 'base.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: base.apk not found inside ZIP."
            exit 1
          fi

          cp "$APK" work/base.apk

          echo "Base APK:"
          ls -lh work/base.apk

      - name: Install Apktool
        run: |
          curl -fsSL \
            -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar

      - name: Decode base APK
        run: |
          set -e

          java -jar /tmp/apktool.jar d \
            -f \
            work/base.apk \
            -o work/decoded

      - name: Restore native libraries from APK splits
        run: |
          set -e

          mkdir -p work/native

          echo "=== APK splits ==="
          find work/input -type f -name '*.apk' -print | sort

          echo
          echo "=== Extracting native libraries ==="

          find work/input -type f -name '*.apk' -print0 |
          while IFS= read -r -d '' apk; do

            unzip -l "$apk" |
              awk '/lib\/[^ ]+\/[^ ]+\.so$/ {print $4}' |
              while IFS= read -r lib; do

                [ -n "$lib" ] || continue

                abi="$(printf '%s\n' "$lib" | cut -d/ -f2)"
                name="$(printf '%s\n' "$lib" | cut -d/ -f3)"

                mkdir -p "work/native/$abi"

                unzip -p "$apk" "$lib" \
                  > "work/native/$abi/$name"

              done

          done

          echo
          echo "=== Recovered native libraries ==="

          find work/native \
            -type f \
            -name '*.so' \
            -print | sort

          test "$(find work/native -type f -name '*.so' | wc -l)" -gt 0

          echo
          echo "=== Restoring libraries into decoded APK ==="

          find work/native \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print0 |
          while IFS= read -r -d '' abi_dir; do

            abi="$(basename "$abi_dir")"

            mkdir -p "work/decoded/lib/$abi"

            cp -f \
              "$abi_dir"/*.so \
              "work/decoded/lib/$abi/"

          done

          echo
          echo "=== Final decoded native libraries ==="

          find work/decoded/lib \
            -type f \
            -name '*.so' \
            -print | sort

          test "$(find work/decoded/lib -type f -name '*.so' | wc -l)" -gt 0

      - name: Apply Aetherwave identity
        run: |
          set -e

          OLD='com.tubemusicdown.musictubedownallmusicdownolder'
          NEW='com.ciphertun.aetherwave'

          python3 <<'PY'
          from pathlib import Path

          root = Path("work/decoded")

          old = "com.tubemusicdown.musictubedownallmusicdownolder"
          new = "com.ciphertun.aetherwave"

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if p.suffix.lower() not in {
                  ".xml",
                  ".smali",
                  ".json",
                  ".txt"
              }:
                  continue

              try:
                  data = p.read_text(errors="ignore")
                  changed = data.replace(old, new)
                  changed = changed.replace(
                      "Music Downloader",
                      "Aetherwave"
                  )

                  if changed != data:
                      p.write_text(changed)
              except Exception:
                  pass
          PY

      - name: Remove Android advertising integrations
        run: |
          set -e

          python3 <<'PY2'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("work/decoded/AndroidManifest.xml")

          ANDROID = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID)

          tree = ET.parse(path)
          root = tree.getroot()

          def android_name(element):
              return element.get(
                  f"{{{ANDROID}}}name",
                  ""
              )

          # Remove advertising ID permissions.
          for child in list(root):

              if child.tag != "uses-permission":
                  continue

              name = android_name(child)

              if name in {
                  "android.permission.AD_ID",
                  "com.google.android.gms.permission.AD_ID",
              }:
                  root.remove(child)

          # Remove explicit ad metadata.
          application = root.find("application")

          if application is not None:

              for child in list(application):

                  if child.tag != "meta-data":
                      continue

                  name = android_name(child).lower()

                  if any(term in name for term in (
                      "admob",
                      "ad_manager",
                      "applovin",
                      "facebook_ads",
                      "audience_network",
                  )):
                      application.remove(child)

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )
          PY2

          echo "Android advertising permissions/metadata removed."

          echo
          echo "=== Remaining manifest ad references ==="

          grep -niE \
            'admob|google.*ads|applovin|facebook.*ads|audience.?network|AD_ID|adsidentifier' \
            work/decoded/AndroidManifest.xml \
            || true

      - name: Verify Aetherwave identity
        run: |
          set -e

          echo "=== Manifest package ==="
          grep -Rni \
            'com.ciphertun.aetherwave' \
            work/decoded/AndroidManifest.xml

          echo
          echo "=== Checking old package ==="

          if grep -Rni \
            'com.tubemusicdown.musictubedownallmusicdownolder' \
            work/decoded/AndroidManifest.xml; then
            echo "ERROR: Old package still exists in manifest."
            exit 1
          fi

          echo
          echo "Identity verification passed."

      - name: Inspect existing download/storage implementation
        run: |
          mkdir -p work/report

          echo "=== Android-side storage references ===" \
            > work/report/storage-analysis.txt

          grep -RniE \
            'Download/|Music/|/storage/|MediaStore|FileOutputStream|RandomAccessFile|externalFilesDir' \
            work/decoded \
            >> work/report/storage-analysis.txt || true

          echo \
            >> work/report/storage-analysis.txt

          echo "=== libapp.so storage references ===" \
            >> work/report/storage-analysis.txt

          find work/decoded \
            -type f \
            -name 'libapp.so' \
            -print0 |
          while IFS= read -r -d '' f; do
            echo
            echo "FILE: $f"

            strings -a "$f" |
              grep -Ei \
              '/storage/|Download/|Music/|\.mp3|\.m4a|\.flac|MediaStore' \
              | head -1000 || true
          done \
          >> work/report/storage-analysis.txt

          echo
          echo "Storage analysis generated."

      - name: Audit AOT advertising and storage references
        run: |
          set -e

          mkdir -p work/report

          REPORT="work/report/aetherwave-audit.txt"

          {
            echo "=============================================="
            echo " AETHERWAVE AUDIT"
            echo "=============================================="
            echo

            echo "=== Android advertising references ==="

            grep -RniE \
              'com/google/android/gms/ads|com/applovin|com/facebook/ads|admob|applovin|audience.?network|adsidentifier' \
              work/decoded \
              || true

            echo
            echo "=== Flutter AOT advertising references ==="

            find work/decoded \
              -type f \
              -name 'libapp.so' \
              -print0 |
            while IFS= read -r -d '' f; do

              echo
              echo "FILE: $f"

              strings -a "$f" |
                grep -Ei \
                'admob|google_mobile_ads|applovin|facebook|audience.?network|interstitial|rewarded|banner.?ad|app.?open.?ad|ad.?unit|adsidentifier' \
                | head -2000 \
                || true

            done

            echo
            echo "=== Flutter AOT storage/download references ==="

            find work/decoded \
              -type f \
              -name 'libapp.so' \
              -print0 |
            while IFS= read -r -d '' f; do

              echo
              echo "FILE: $f"

              strings -a "$f" |
                grep -Ei \
                '/storage/|Download/|Music/|\.mp3|\.m4a|\.flac|MediaStore|downloads' \
                | head -2000 \
                || true

            done

            echo
            echo "=== Native libraries ==="

            find work/decoded/lib \
              -type f \
              -name '*.so' \
              -print \
              | sort

          } > "$REPORT"

          cat "$REPORT"

      - name: Rebuild APK
        run: |
          set -e

          java -jar /tmp/apktool.jar b \
            work/decoded \
            -o work/Aetherwave-debug-unsigned.apk

      - name: Align APK
        run: |
          set -e

          BT="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)"

          "$BT/zipalign" \
            -f \
            -p \
            4 \
            work/Aetherwave-debug-unsigned.apk \
            work/Aetherwave-debug.apk

      - name: Verify rebuilt APK native libraries
        run: |
          set -e

          echo "=== Rebuilt APK ==="
          ls -lh work/Aetherwave-debug.apk

          echo
          echo "=== Native libraries inside APK ==="

          unzip -l work/Aetherwave-debug.apk |
            grep -E 'lib/[^ ]+\.so$' \
            | head -300

          COUNT="$(
            unzip -l work/Aetherwave-debug.apk |
              grep -Ec 'lib/[^ ]+\.so$' || true
          )"

          echo
          echo "Native library count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: APK contains ZERO native libraries."
            exit 1
          fi

          echo
          echo "Native library verification passed."

      - name: Create debug keystore
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "$HOME/.android/debug.keystore"

      - name: Sign debug APK
        run: |
          set -e

          BT="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)"

          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            work/Aetherwave-debug.apk

          "$BT/apksigner" verify \
            --verbose \
            work/Aetherwave-debug.apk

      - name: Upload Aetherwave debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Aetherwave-debug
          path: |
            work/Aetherwave-debug.apk
            work/report/aetherwave-audit.txt
          retention-days: 7
