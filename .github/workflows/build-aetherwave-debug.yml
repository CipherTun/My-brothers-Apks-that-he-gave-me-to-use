name: Build Aetherwave Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------
      # 2. Locate and extract THE COMPLETE APK SET
      # ------------------------------------------------
      - name: Extract complete original APK set
        run: |
          set -e

          mkdir -p work/input

          FILE="$(find . -type f -iname '*.zip' -print \
            | grep -Ei 'The base Apk to use|base.*zip' \
            | head -1)"

          if [ -z "$FILE" ]; then
            echo "ERROR: Base APK ZIP not found."
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Using:"
          echo "$FILE"

          mkdir -p work/unpacked

          unzip -q "$FILE" -d work/unpacked

          # APKEditor expects APK files directly inside its input directory.
          # Flatten the supplied split APK set without changing any APK contents.
          find work/unpacked \
            -type f \
            -name '*.apk' \
            -exec cp -f {} work/input/ \;

          echo
          echo "APK SET:"
          find work/input \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print \
            | sort

          COUNT="$(find work/input -maxdepth 1 -type f -name '*.apk' | wc -l)"

          echo
          echo "APK count: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No APKs found."
            exit 1
          fi

      # ------------------------------------------------
      # 3. Download APKEditor ONLY ON GITHUB RUNNER
      # ------------------------------------------------
      - name: Download APKEditor on GitHub runner
        run: |
          set -e

          mkdir -p work/tools

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            -o work/tools/APKEditor.jar \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar

          test -s work/tools/APKEditor.jar

          echo
          echo "APKEditor downloaded successfully on GitHub runner."
          echo "APKEditor will be used by the next build step."

      # ------------------------------------------------
      # 4. Inspect complete APK set
      # ------------------------------------------------
      - name: Inspect APK set
        run: |
          set -e

          mkdir -p work/report

          echo "=== ORIGINAL APK FILES ===" \
            > work/report/apk-set.txt

          find work/input \
            -type f \
            -name '*.apk' \
            -print \
            | sort \
            >> work/report/apk-set.txt

          echo >> work/report/apk-set.txt

          echo "=== APK SIZES ===" \
            >> work/report/apk-set.txt

          find work/input \
            -type f \
            -name '*.apk' \
            -print0 |
          while IFS= read -r -d '' apk; do
            ls -lh "$apk"
          done \
            >> work/report/apk-set.txt

          cat work/report/apk-set.txt

      # ------------------------------------------------
      # 5. MERGE ALL SPLITS
      # ------------------------------------------------
      - name: Merge complete APK set into standalone APK
        run: |
          set -e

          java -jar work/tools/APKEditor.jar \
            m \
            -i work/input \
            -o work/Aetherwave-merged.apk \
            -f \
            -validate-modules

          test -s work/Aetherwave-merged.apk

          echo
          echo "MERGED APK:"
          ls -lh work/Aetherwave-merged.apk

      # ------------------------------------------------
      # 6. Decode merged APK
      # ------------------------------------------------
      - name: Decode merged APK
        run: |
          set -e

          java -jar work/tools/APKEditor.jar \
            d \
            -i work/Aetherwave-merged.apk \
            -o work/decoded

          test -f work/decoded/AndroidManifest.xml

      # ------------------------------------------------
      # 7. Change ONLY requested identity
      # ------------------------------------------------
      - name: Apply Aetherwave identity
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          root = Path("work/decoded")

          old = "com.tubemusicdown.musictubedownallmusicdownolder"
          new = "com.ciphertun.aetherwave"

          extensions = {
              ".xml",
              ".smali",
              ".json",
              ".txt",
              ".properties",
          }

          replacements = {
              old: new,
              "Music Downloader": "Aetherwave",
          }

          changed = 0

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if p.suffix.lower() not in extensions:
                  continue

              try:
                  data = p.read_text(errors="ignore")
              except Exception:
                  continue

              updated = data

              for src, dst in replacements.items():
                  updated = updated.replace(src, dst)

              if updated != data:
                  p.write_text(updated)
                  changed += 1

          print("Files changed:", changed)
          PY

      # ------------------------------------------------
      # 8. Remove ad permissions/metadata
      # ------------------------------------------------
      - name: Remove advertising permissions and metadata
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("work/decoded/AndroidManifest.xml")
          s = p.read_text(errors="ignore")

          permission_patterns = [
              r'\s*<uses-permission[^>]+android\.permission\.AD_ID[^>]*/>',
              r'\s*<uses-permission[^>]+com\.google\.android\.gms\.permission\.AD_ID[^>]*/>',
          ]

          for pattern in permission_patterns:
              s = re.sub(pattern, '', s)

          metadata_names = [
              "com.google.android.gms.ads.APPLICATION_ID",
              "com.google.android.gms.ads.AD_MANAGER_APP",
              "com.applovin.sdk.AppLovinSdkKey",
              "com.facebook.sdk.ApplicationId",
              "com.facebook.sdk.ClientToken",
          ]

          for name in metadata_names:
              s = re.sub(
                  rf'\s*<meta-data[^>]+android:name="{re.escape(name)}"[^>]*/>',
                  '',
                  s
              )

          p.write_text(s)
          PY

          echo "Ad permissions and known ad metadata removed."

      # ------------------------------------------------
      # 9. Rebuild
      # ------------------------------------------------
      - name: Rebuild modified standalone APK
        run: |
          set -e

          java -jar work/tools/APKEditor.jar \
            b \
            -i work/decoded \
            -o work/Aetherwave-debug-unsigned.apk

          test -s work/Aetherwave-debug-unsigned.apk

          ls -lh work/Aetherwave-debug-unsigned.apk

      # ------------------------------------------------
      # 10. Verify package contents
      # ------------------------------------------------
      - name: Verify final APK contents
        run: |
          set -e

          APK="work/Aetherwave-debug-unsigned.apk"

          echo "=== APK CONTENTS ==="

          unzip -l "$APK" |
            grep -E \
            'AndroidManifest.xml|classes[0-9]*\.dex|resources\.arsc|lib/.*\.so' |
            head -300

          echo
          echo "=== NATIVE ABIS ==="

          unzip -l "$APK" |
            grep -E \
            'lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/.*\.so' |
            sort

          echo
          echo "=== DEX ==="

          DEX_COUNT="$(
            unzip -l "$APK" |
            grep -E '[[:space:]]classes[0-9]*\.dex$' |
            wc -l
          )"

          echo "DEX count: $DEX_COUNT"

          if [ "$DEX_COUNT" -lt 1 ]; then
            echo "ERROR: No DEX files."
            exit 1
          fi

          echo
          echo "=== NATIVE LIBRARY COUNT ==="

          SO_COUNT="$(
            unzip -l "$APK" |
            grep -E 'lib/.*/.*\.so$' |
            wc -l
          )"

          echo "Native libraries: $SO_COUNT"

          if [ "$SO_COUNT" -lt 1 ]; then
            echo "ERROR: Native libraries are missing."
            exit 1
          fi

      # ------------------------------------------------
      # 11. Verify identity
      # ------------------------------------------------
      - name: Verify Aetherwave identity
        run: |
          set -e

          echo "=== AETHERWAVE ==="

          grep -Rni \
            'com.ciphertun.aetherwave' \
            work/decoded/AndroidManifest.xml

          echo
          echo "=== OLD PACKAGE CHECK ==="

          if grep -Rni \
            'com.tubemusicdown.musictubedownallmusicdownolder' \
            work/decoded \
            --exclude='*.so'; then

            echo "ERROR: Old package identifier remains."
            exit 1
          fi

          echo
          echo "Identity verification passed."

      # ------------------------------------------------
      # 12. Align
      # ------------------------------------------------
      - name: Align APK
        run: |
          set -e

          BT="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)"

          "$BT/zipalign" \
            -f \
            -p \
            4 \
            work/Aetherwave-debug-unsigned.apk \
            work/Aetherwave-debug.apk

      # ------------------------------------------------
      # 13. Create debug keystore ON GITHUB RUNNER
      # ------------------------------------------------
      - name: Create debug keystore
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # ------------------------------------------------
      # 14. Sign
      # ------------------------------------------------
      - name: Sign Aetherwave debug APK
        run: |
          set -e

          BT="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)"

          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            work/Aetherwave-debug.apk

          "$BT/apksigner" verify \
            --verbose \
            work/Aetherwave-debug.apk

      # ------------------------------------------------
      # 15. Final verification
      # ------------------------------------------------
      - name: Final APK verification
        run: |
          set -e

          APK="work/Aetherwave-debug.apk"

          test -s "$APK"

          echo "=============================================="
          echo " FINAL AETHERWAVE APK"
          echo "=============================================="

          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo
          echo "SIGNATURE:"
          
          BT="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)"

          "$BT/apksigner" verify \
            --verbose \
            "$APK"

          echo
          echo "FINAL VERIFICATION PASSED."

      # ------------------------------------------------
      # 16. Upload ONE standalone APK
      # ------------------------------------------------
      - name: Upload standalone Aetherwave APK
        uses: actions/upload-artifact@v4
        with:
          name: Aetherwave-debug
          path: |
            work/Aetherwave-debug.apk
            work/report/apk-set.txt
          retention-days: 7
