name: Decompile and Inspect Brother Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    name: Decompile APK packages
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip zip jq wget aapt

          JADX_URL="$(
            curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest |
            jq -r '.assets[] | select(.name | test("^jadx-[0-9.]+\\.zip$")) | .browser_download_url' |
            head -n 1
          )"

          test -n "$JADX_URL"

          mkdir -p "$RUNNER_TEMP/tools/jadx"
          curl -fL "$JADX_URL" -o "$RUNNER_TEMP/jadx.zip"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/tools/jadx"

          APKTOOL_URL="$(
            curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest |
            jq -r '.assets[] | select(.name == "apktool.jar") | .browser_download_url' |
            head -n 1
          )"

          test -n "$APKTOOL_URL"

          curl -fL "$APKTOOL_URL" -o "$RUNNER_TEMP/apktool.jar"

          JADX_BIN="$(find "$RUNNER_TEMP/tools/jadx" -type f -path '*/bin/jadx' | head -n 1)"

          test -n "$JADX_BIN"

          chmod +x "$JADX_BIN"

          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"
          echo "APKTOOL_JAR=$RUNNER_TEMP/apktool.jar" >> "$GITHUB_ENV"

          "$JADX_BIN" --version
          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Extract original ZIP packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/apps

          unzip -q "Apk 1.zip" -d "work/apps/apk1"
          unzip -q "Apk 2.zip" -d "work/apps/apk2"
          unzip -q "The base apk to use.zip" -d "work/apps/base"

          find work/apps -type f -name '*.apk' -print | sort > work/all-apks.txt

          echo "APK files found:"
          cat work/all-apks.txt

      - name: Inspect APK metadata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p analysis/metadata

          while IFS= read -r apk; do
            safe="$(echo "$apk" | sed 's#[/ ]#_#g; s#\.apk$##')"

            {
              echo "============================================================"
              echo "FILE: $apk"
              echo "============================================================"
              sha256sum "$apk"
              stat -c 'SIZE_BYTES=%s' "$apk"
              echo
              echo "----- aapt dump badging -----"
              aapt dump badging "$apk" || true
              echo
              echo "----- aapt permissions -----"
              aapt dump permissions "$apk" || true
            } > "analysis/metadata/$safe.txt"
          done < work/all-apks.txt

      - name: Decompile every APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p analysis/jadx analysis/apktool

          while IFS= read -r apk; do
            safe="$(echo "$apk" | sed 's#[/ ]#_#g; s#\.apk$##')"

            echo "============================================================"
            echo "Decompiling $apk"
            echo "============================================================"

            "$JADX_BIN" \
              --deobf \
              --show-bad-code \
              --no-res \
              -d "analysis/jadx/$safe" \
              "$apk" || true

            java -jar "$APKTOOL_JAR" d \
              -f \
              -o "analysis/apktool/$safe" \
              "$apk" || true
          done < work/all-apks.txt

      - name: Build detailed feature report
        shell: bash
        run: |
          set -euo pipefail

          REPORT="analysis/BROTHER_APPS_DETAILED_REPORT.txt"

          {
            echo "AETHERWAVE BROTHER APPS - DETAILED REPORT"
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "These are decompiled representations of compiled APKs."
            echo "They are not the original source projects."
            echo

            echo "============================================================"
            echo "APK INVENTORY"
            echo "============================================================"
            cat work/all-apks.txt
            echo

            echo "============================================================"
            echo "PACKAGE / LABEL / SDK / COMPONENTS"
            echo "============================================================"
            grep -RniE \
              'package=|android:label=|android:minSdkVersion|android:targetSdkVersion|<activity|<service|<receiver|<provider' \
              analysis/apktool 2>/dev/null |
              head -n 5000 || true
            echo

            echo "============================================================"
            echo "NETWORK / API / URLS"
            echo "============================================================"
            grep -RhoE \
              'https?://[^"<> ]+|wss?://[^"<> ]+' \
              analysis/jadx analysis/apktool 2>/dev/null |
              sort -u |
              head -n 5000 || true
            echo

            echo "============================================================"
            echo "DOWNLOAD / MEDIA / STORAGE"
            echo "============================================================"
            grep -RniE \
              'download|MediaStore|RELATIVE_PATH|Music/|Environment\.DIRECTORY_MUSIC|contentResolver|OutputStream|FileOutputStream|DownloadManager|MediaMetadataRetriever|MediaPlayer|ExoPlayer|audio|mp3|m4a|aac|flac|ogg|wav' \
              analysis/jadx analysis/apktool 2>/dev/null |
              head -n 10000 || true
            echo

            echo "============================================================"
            echo "FEATURE / UI / NAVIGATION"
            echo "============================================================"
            grep -RniE \
              'search|home|library|playlist|favorite|favourite|history|settings|album|artist|song|track|queue|lyrics|notification|share|equalizer|theme|dark|night|sleep|offline|background|player|music' \
              analysis/jadx analysis/apktool 2>/dev/null |
              head -n 15000 || true
            echo

            echo "============================================================"
            echo "LIBRARIES / PACKAGES"
            echo "============================================================"
            grep -RhoE \
              '([A-Za-z0-9_-]+\.){2,}[A-Za-z0-9_$-]+' \
              analysis/jadx 2>/dev/null |
              sort -u |
              head -n 10000 || true

          } > "$REPORT"

          wc -l "$REPORT"
          wc -c "$REPORT"

      - name: Package inspection artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final-artifact

          cp -r analysis final-artifact/
          cp work/all-apks.txt final-artifact/ORIGINAL_APK_INVENTORY.txt

          cat > final-artifact/README.txt <<'EOF'
          Aetherwave Brother Apps Decompiled Inspection

          Contains:
          - APK metadata
          - decoded Android manifests/resources
          - JADX decompiled source
          - API/network references
          - download/media/storage references
          - UI/features/navigation references
          - library/package references

          The original ZIP files were not modified.

          Decompiled code is reconstructed from compiled APKs and may not
          exactly match the original source code.
          EOF

          cd final-artifact
          zip -qr ../aetherwave-brother-apps-decompiled-inspection.zip .
          cd ..

          sha256sum aetherwave-brother-apps-decompiled-inspection.zip
          ls -lh aetherwave-brother-apps-decompiled-inspection.zip

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-brother-apps-decompiled-inspection
          path: aetherwave-brother-apps-decompiled-inspection.zip
          retention-days: 14
          compression-level: 0