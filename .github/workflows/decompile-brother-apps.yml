name: Decompile and Inspect Brother Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    name: Decompile APK packages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install decompilation tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip zip jq aapt

          mkdir -p "$RUNNER_TEMP/tools"

          # JADX 1.5.6
          curl -fL \
            "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" \
            -o "$RUNNER_TEMP/jadx.zip"

          unzip -q "$RUNNER_TEMP/jadx.zip" \
            -d "$RUNNER_TEMP/tools/jadx"

          JADX_BIN="$RUNNER_TEMP/tools/jadx/bin/jadx"

          test -x "$JADX_BIN"

          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"

          "$JADX_BIN" --version

          # Apktool 3.0.2
          curl -fL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" \
            -o "$RUNNER_TEMP/apktool.jar"

          test -s "$RUNNER_TEMP/apktool.jar"

          echo "APKTOOL_JAR=$RUNNER_TEMP/apktool.jar" >> "$GITHUB_ENV"

          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Extract original APK ZIPs
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p work/apps

          unzip -q "Apk 1.zip" \
            -d "work/apps/apk1"

          unzip -q "Apk 2.zip" \
            -d "work/apps/apk2"

          unzip -q "The base apk to use.zip" \
            -d "work/apps/base"

          find work/apps \
            -type f \
            -name "*.apk" \
            -print \
            | sort \
            > work/all-apks.txt

          echo
          echo "APK FILES FOUND:"
          cat work/all-apks.txt

          COUNT="$(wc -l < work/all-apks.txt)"

          echo
          echo "APK COUNT: $COUNT"

          test "$COUNT" -ge 3

      - name: Inspect APK metadata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p analysis/metadata

          while IFS= read -r apk; do

            safe="$(echo "$apk" |
              sed 's#[/ ]#_#g; s#\.apk$##')"

            {
              echo "============================================================"
              echo "APK: $apk"
              echo "============================================================"

              echo
              echo "SHA256:"
              sha256sum "$apk"

              echo
              echo "SIZE:"
              stat -c "%s bytes" "$apk"

              echo
              echo "AAPT BADGING:"
              aapt dump badging "$apk" || true

              echo
              echo "AAPT PERMISSIONS:"
              aapt dump permissions "$apk" || true

            } > "analysis/metadata/$safe.txt"

          done < work/all-apks.txt

      - name: Decompile APKs with JADX
        shell: bash
        run: |
          set -u

          mkdir -p analysis/jadx

          while IFS= read -r apk; do

            safe="$(echo "$apk" |
              sed 's#[/ ]#_#g; s#\.apk$##')"

            echo
            echo "============================================================"
            echo "JADX: $apk"
            echo "============================================================"

            mkdir -p "analysis/jadx/$safe"

            "$JADX_BIN" \
              --deobf \
              --show-bad-code \
              --no-res \
              --log-level error \
              -d "analysis/jadx/$safe" \
              "$apk" \
              2>&1 | tee "analysis/jadx/$safe/jadx.log" || true

          done < work/all-apks.txt

      - name: Decode APK resources with Apktool
        shell: bash
        run: |
          set -u

          mkdir -p analysis/apktool

          while IFS= read -r apk; do

            safe="$(echo "$apk" |
              sed 's#[/ ]#_#g; s#\.apk$##')"

            echo
            echo "============================================================"
            echo "APKTOOL: $apk"
            echo "============================================================"

            java -jar "$APKTOOL_JAR" d \
              --force \
              --output "analysis/apktool/$safe" \
              "$apk" \
              2>&1 | tee "analysis/apktool/$safe.log" || true

          done < work/all-apks.txt

      - name: Generate detailed analysis report
        shell: bash
        run: |
          set -euo pipefail

          REPORT="analysis/BROTHER_APPS_DETAILED_REPORT.txt"

          {
            echo "AETHERWAVE BROTHER APPS"
            echo "DETAILED APK ANALYSIS"
            echo
            echo "Generated:"
            date -u
            echo
            echo "============================================================"
            echo "APK INVENTORY"
            echo "============================================================"
            cat work/all-apks.txt

            echo
            echo "============================================================"
            echo "PACKAGE / APPLICATION / SDK"
            echo "============================================================"

            grep -RniE \
              'package=|android:label=|android:minSdkVersion|android:targetSdkVersion' \
              analysis/apktool \
              2>/dev/null \
              | head -n 10000 || true

            echo
            echo "============================================================"
            echo "ACTIVITIES / SERVICES / RECEIVERS / PROVIDERS"
            echo "============================================================"

            grep -RniE \
              '<activity|<service|<receiver|<provider' \
              analysis/apktool \
              2>/dev/null \
              | head -n 15000 || true

            echo
            echo "============================================================"
            echo "PERMISSIONS"
            echo "============================================================"

            grep -RniE \
              'uses-permission|permission' \
              analysis/apktool \
              2>/dev/null \
              | head -n 15000 || true

            echo
            echo "============================================================"
            echo "NETWORK / API / URLS"
            echo "============================================================"

            grep -RhoE \
              'https?://[^"<>[:space:]]+|wss?://[^"<>[:space:]]+' \
              analysis/jadx \
              analysis/apktool \
              2>/dev/null \
              | sort -u \
              | head -n 10000 || true

            echo
            echo "============================================================"
            echo "MUSIC / DOWNLOAD / STORAGE"
            echo "============================================================"

            grep -RniE \
              'download|DownloadManager|MediaStore|RELATIVE_PATH|DIRECTORY_MUSIC|contentResolver|FileOutputStream|OutputStream|Music/|mp3|m4a|aac|flac|ogg|wav|audio|MediaPlayer|ExoPlayer' \
              analysis/jadx \
              analysis/apktool \
              2>/dev/null \
              | head -n 20000 || true

            echo
            echo "============================================================"
            echo "MUSIC SOURCES / SEARCH"
            echo "============================================================"

            grep -RniE \
              'search|query|youtube|soundcloud|spotify|jamendo|audiomack|deezer|itunes|podcast|musicbrainz|lastfm|stream|source|catalog' \
              analysis/jadx \
              analysis/apktool \
              2>/dev/null \
              | head -n 25000 || true

            echo
            echo "============================================================"
            echo "PLAYER / QUEUE / PLAYLIST"
            echo "============================================================"

            grep -RniE \
              'player|playback|queue|playlist|favorite|favourite|history|repeat|shuffle|lyrics|album|artist|track|song' \
              analysis/jadx \
              analysis/apktool \
              2>/dev/null \
              | head -n 25000 || true

            echo
            echo "============================================================"
            echo "UI / NAVIGATION / SETTINGS"
            echo "============================================================"

            grep -RniE \
              'home|library|settings|navigation|drawer|menu|theme|dark|night|notification|share|equalizer|offline|background' \
              analysis/jadx \
              analysis/apktool \
              2>/dev/null \
              | head -n 25000 || true

            echo
            echo "============================================================"
            echo "NATIVE LIBRARIES"
            echo "============================================================"

            find work/apps \
              -type f \
              \( -name "*.so" -o -name "*.dex" \) \
              -print \
              | sort || true

          } > "$REPORT"

          echo
          echo "REPORT:"
          wc -l "$REPORT"
          wc -c "$REPORT"

      - name: Create inspection package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final-artifact

          cp -r analysis final-artifact/
          cp work/all-apks.txt \
            final-artifact/ORIGINAL_APK_INVENTORY.txt

          cat > final-artifact/README.txt <<'EOF'
          AETHERWAVE BROTHER APP INSPECTION

          The original APK ZIP files in the repository were not modified.

          This inspection contains:

          - APK metadata
          - package/application information
          - permissions
          - activities/services/receivers/providers
          - decoded Android resources
          - decompiled Java source
          - API/network references
          - music sources
          - download implementation references
          - storage implementation references
          - player/queue/playlist references
          - UI/navigation/settings references
          - native library inventory

          JADX/Apktool output is reconstructed from compiled APKs.
          It is not the original source code.
          EOF

          cd final-artifact

          zip -qr \
            ../aetherwave-brother-apps-decompiled-inspection.zip \
            .

          cd ..

          echo
          echo "FINAL ARTIFACT:"
          ls -lh \
            aetherwave-brother-apps-decompiled-inspection.zip

          sha256sum \
            aetherwave-brother-apps-decompiled-inspection.zip

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-brother-apps-decompiled-inspection
          path: aetherwave-brother-apps-decompiled-inspection.zip
          retention-days: 14
          compression-level: 0